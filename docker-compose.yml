# 一键启动：docker compose up --build
#   Web      http://localhost:3000
#   API      http://localhost:8000/docs
#   MinIO    http://localhost:9001 （tsumii / tsumii-secret）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tsumii
      POSTGRES_PASSWORD: tsumii
      POSTGRES_DB: tsumii
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsumii"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tsumii
      MINIO_ROOT_PASSWORD: tsumii-secret
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 tsumii tsumii-secret; do sleep 1; done;
             mc mb --ignore-existing local/tsumii"

  api: &api
    build: ./api
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://tsumii:tsumii@postgres:5432/tsumii
      AUTO_CREATE_TABLES: "false"
      QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: tsumii
      S3_ACCESS_KEY: tsumii
      S3_SECRET_KEY: tsumii-secret
      AI_PROVIDER: mock
      CATALOG_SOURCE: sample
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  worker:
    <<: *api
    command: ["python", "-m", "app.workers.worker"]
    ports: []

  web:
    build: ./web
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
